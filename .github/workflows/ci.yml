name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger runs the optional `real-stark-proof` job (RISC0_DEV_MODE=0),
  # which is too slow for per-push CI but must stay reproducible on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The requirement map (docs/requirements-map.json -> docs/REQUIREMENTS.md): every RFP-017 clause,
  # quoted from the RFP at a pinned commit, with its status and the named tests and records that
  # show it. Fails when a clause is not verbatim or an RFP item is not covered, a named test does
  # not exist or no job below runs it, a "shown" clause names no test run on every push, or the
  # page is stale. The jobs below check the same names again against what they build and run.
  requirement-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Requirement map against the RFP text at its pinned commit, the source, the E2E suite and this workflow
        run: |
          mkdir -p target/reqmap
          curl -fsSL --retry 3 -o target/reqmap/RFP-017.md "$(python3 scripts/check-reqmap.py --print-rfp-url)"
          python3 scripts/check-reqmap.py --rfp target/reqmap/RFP-017.md

      - name: The map check catches every kind of error it claims to (self-test)
        run: python3 scripts/check-reqmap.py --self-test --rfp target/reqmap/RFP-017.md

  core-and-guest:
    runs-on: ubuntu-latest
    # fmt + clippy + a cold build of the LEZ dependency tree + the real-ELF test
    # suite (the 2026-11-20 verified run alone takes ~11 min of test time; allow
    # 90 so a cold runner with no caches never flakes on the deadline).
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RISC0_BUILD_LOCKED: "1"
    steps:
      # All actions pinned by verified commit SHA (aligned with logos-co/rfp PR 255).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free runner disk space for zkVM guest builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache RISC Zero 3.0.5 toolchains and pinned rzup 0.5.2
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.risc0
            ~/.cargo/bin/rzup
          key: risc0-3.0.5-rzup-0.5.2-rust-1.91.1-cpp-2024.1.5-v1

      - name: Install pinned rzup 0.5.2 and RISC Zero 3.0.5 (guest Rust 1.91.1 + C++ 2024.1.5)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$PATH"
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          # Explicitly pin the HOST rustup/cargo homes so any rustup proxies that
          # rzup drops into ~/.risc0/bin defer to the dtolnay host toolchain
          # pinned by rust-toolchain.toml (1.98.1) instead of resolving rzup's
          # guest 1.91.1. Mirrors upstream LEZ's CI image, which keeps
          # RUSTUP_HOME and CARGO_HOME pointing at the host for exactly this
          # reason (lez-v0.4.0-rc3/.github/docker/ci.Dockerfile:11-16).
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          # Pinned crates.io install without publish/AWS-SDK features (no unpinned curl|bash scripts).
          command -v rzup >/dev/null || cargo install --locked --no-default-features --features cli,install rzup --version 0.5.2
          # Always run rzup install even on cache hit so ~/.cargo/bin and rustup symlinks are refreshed.
          rzup install cargo-risczero 3.0.5
          rzup install r0vm 3.0.5
          rzup install rust 1.91.1
          rzup install cpp 2024.1.5
          r0vm --version
          # Smoke-test the exact environment later steps will see (~/.risc0/bin first
          # on PATH + explicit host RUSTUP_HOME): if rzup's proxies hijack `rustc`,
          # `cargo`, or `rustfmt` away from the pinned 1.98.1 host toolchain, fail
          # here instead of deep inside fmt/clippy/test. Mirrors the upstream LEZ
          # CI image's "smoke-test every tool the jobs use" rule.
          PATH="$HOME/.risc0/bin:$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" bash -c '
            rustc --version | grep -F "1.98.1" &&
            rustfmt --version &&
            cargo clippy --version &&
            cargo --version
          '

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: escapement-v04

      - name: Format check (workspace + guest)
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check crates/escapement-methods/guest/src/bin/escapement.rs

      - name: Clippy check
        env:
          RISC0_DEV_MODE: "1"
          # clippy-driver cannot cross-compile the riscv32im guest; the guest is a 3-line wrapper
          # around escapement-program, which clippy lints as a host crate.
          RISC0_SKIP_BUILD: "1"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Reproducible guest (image id, SHA-256 and size must equal image-ids.tsv, built at this runner's path)
        run: scripts/build-guest.sh --check

      - name: Core math, SDK, SPEL IDL drift and round trip, real-ELF v0.4 integration, privacy, invariant and security tests
        env:
          RISC0_DEV_MODE: "1"
        run: cargo test --workspace --locked -- --nocapture

      - name: Requirement map against the test binaries just built (every named test is in them)
        shell: bash
        env:
          RISC0_DEV_MODE: "1"
        run: |
          mkdir -p target/reqmap
          cargo test --workspace --locked -- --list 2>&1 | tee target/reqmap/workspace-tests.txt
          python3 scripts/check-reqmap.py --cargo-job core-and-guest --cargo-list target/reqmap/workspace-tests.txt

  # S2: the end-to-end suite against an unmodified standalone LEZ v0.4.0-rc3 sequencer (mock
  # Bedrock, loopback only), driven by the Escapement CLI: immutable deployment and header read-back,
  # admin init, native schedules of every kind, public and one-transaction private claims, cancel,
  # milestones, transfer, and refusals sent on chain. Dev-mode receipts on push and pull requests.
  e2e-standalone-sequencer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: System packages (pcsc for LEZ's crates, jq for the suite, protoc for the LEZ build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpcsclite-dev pkg-config jq protobuf-compiler

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.98.1

      - name: Cache RISC Zero 3.0.5 toolchains and pinned rzup 0.5.2
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.risc0
            ~/.cargo/bin/rzup
          key: risc0-3.0.5-rzup-0.5.2-rust-1.91.1-cpp-2024.1.5-v1

      - name: Install pinned rzup 0.5.2 and RISC Zero 3.0.5 (guest Rust 1.91.1 + C++ 2024.1.5)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$PATH"
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          command -v rzup >/dev/null || cargo install --locked --no-default-features --features cli,install rzup --version 0.5.2
          rzup install cargo-risczero 3.0.5
          rzup install r0vm 3.0.5
          rzup install rust 1.91.1
          rzup install cpp 2024.1.5

      - name: Cache the sequencer build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: e2e/.run/bin
          key: lez-sequencer-standalone-v0.4.0-rc3-bafd07be-v1

      - name: Build the standalone sequencer (LEZ v0.4.0-rc3, commit asserted) and the CLI
        run: |
          [ -x e2e/.run/bin/sequencer_service_standalone ] || bash e2e/sequencer.sh build-sequencer
          bash e2e/sequencer.sh build-cli

      - name: CLI unit tests (key files 0600, no overwrite, tamper refused, prepared claims)
        run: cd crates/escapement-cli && cargo test --release --locked

      - name: Build the guest (the binary the suite deploys)
        run: scripts/build-guest.sh --check

      - name: End-to-end suite (dev-mode receipts)
        env:
          E2E_DEV_MODE: "1"
        run: bash e2e/run_e2e.sh

      - name: Requirement map against this run (every named E2E check passed; every named CLI test is in its binary)
        shell: bash
        run: |
          mkdir -p target/reqmap
          cargo test --manifest-path crates/escapement-cli/Cargo.toml --release --locked -- --list 2>&1 | tee target/reqmap/cli-tests.txt
          python3 scripts/check-reqmap.py --cargo-job e2e-standalone-sequencer --cargo-list target/reqmap/cli-tests.txt --e2e-records e2e/.run/out/e2e.jsonl

      - name: Keep the suite's records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-records
          # The run's devnet key files (e2e/.run/out/keys/) are never published.
          path: |
            e2e/.run/out/
            !e2e/.run/out/keys/

  # The run records in docs/records/: each record's raw files hashed, its figures re-derived from
  # them, its commits and quoted docs checked, and every proposal figure in docs/records/claims.json
  # compared with the record it cites. Python 3 standard library only.
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The records name the commits they ran on (9d35262, 2ddc57c) and compare their trees.
          fetch-depth: 0

      - name: Re-check the run records against their raw files
        run: python3 scripts/verify-records.py --require-history

  # Optional, manual-only (`workflow_dispatch`): reproduces the in-process real STARK
  # proof (RISC0_DEV_MODE=0) end to end. Too slow to gate every push, but kept
  # in CI so the non-dev-mode claim can never silently rot.
  real-stark-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free runner disk space for zkVM guest builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache RISC Zero 3.0.5 toolchains and pinned rzup 0.5.2
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.risc0
            ~/.cargo/bin/rzup
          key: risc0-3.0.5-rzup-0.5.2-rust-1.91.1-cpp-2024.1.5-v1

      - name: Install pinned rzup 0.5.2 and RISC Zero 3.0.5 (guest Rust 1.91.1 + C++ 2024.1.5)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$PATH"
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          command -v rzup >/dev/null || cargo install --locked --no-default-features --features cli,install rzup --version 0.5.2
          rzup install cargo-risczero 3.0.5
          rzup install r0vm 3.0.5
          rzup install rust 1.91.1
          rzup install cpp 2024.1.5
          r0vm --version
          # Same fail-fast proxy smoke test as the core job.
          PATH="$HOME/.risc0/bin:$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" bash -c '
            rustc --version | grep -F "1.98.1" &&
            rustfmt --version &&
            cargo clippy --version &&
            cargo --version
          '

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: escapement-v04-real-proof

      - name: Reproducible guest (the binary the proof runs; built from source, not from the cache)
        run: scripts/build-guest.sh --check

      - name: Prove the blinded-alias private claim with real STARK receipts (E-02)
        env:
          RISC0_DEV_MODE: "0"
        run: cargo test --locked -p escapement-tests --test escapement_e2e s1_real_proof_dev_mode_0 -- --ignored --nocapture

      - name: Requirement map against the test binary just built (the named real-proof test is in it)
        shell: bash
        env:
          RISC0_DEV_MODE: "0"
        run: |
          mkdir -p target/reqmap
          cargo test --locked -p escapement-tests --test escapement_e2e -- --list 2>&1 | tee target/reqmap/real-proof-tests.txt
          python3 scripts/check-reqmap.py --cargo-job real-stark-proof --cargo-list target/reqmap/real-proof-tests.txt
