[package]
name = "escapement-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
borsh.workspace = true
serde.workspace = true
# Do not inherit `host` feature from workspace into guest builds.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
lez-admin-authority.workspace = true
lez-authority.workspace = true
risc0-zkvm.workspace = true

[dev-dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
proptest.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
