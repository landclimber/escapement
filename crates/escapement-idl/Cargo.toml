[package]
name = "escapement-idl"
description = "SPEL IDL v2 of the Escapement program, generated by SPEL's own generator from escapement-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# SPEL's IDL v2 generator and IDL-driven decoder (logos-co/spel, branch refactor/lez-v0.4.x at c90ca0b,
# which pins LEZ v0.4.0-rc3; the released SPEL v0.7.0 predates LEZ v0.4's actor model).
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "c90ca0bc16c07c89d16425dd28a5f6a2d8428801", features = ["idl-gen", "decode"] }

[dev-dependencies]
borsh.workspace = true
escapement-core.workspace = true
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
serde_json = "1"
