[package]
name = "relay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
